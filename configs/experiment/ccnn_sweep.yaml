# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /model: simplicial/ccnn
  - override /callbacks: default
  - override /trainer: default
  - override /logger: default
  - override /dataset: default
  - override /transforms: ccnn_pipeline
  - override /optimizer: default

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["ccnn"]

seed: 42

optimizer:
  lr: [0.01, 0.001]

transforms:
  ccnn_pipeline

logger:
  wandb:
    project: "TopoBench"

trainer:
  min_epochs: 50
  max_epochs: 1000
  check_val_every_n_epoch: 1
  accelerator: gpu
  devices: 1

callbacks:
  early_stopping:
    patience: 50

dataset:
  dataloader:
    params:
      batch_size: 1
  split_params:
    data_seed: [0, 3, 5, 7, 9]

model:
  feature_encoder:
    out_channels: [32, 64, 128]
    proj_dropout: [0.25, 0.5]
  backbone:
    n_layers: [2, 3, 4, 5]
    use_parameter_5: True
    dropout: [0.0, 0.1, 0.5]
    norm_type: [None, BatchNorm, LayerNorm]
  readout:
    readout_name: [PropagateSignalDown, NoReadOut]
  compile: false


